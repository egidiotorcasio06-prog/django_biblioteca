<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiungi Libro</title>
</head>
<body>
    <h1>{{ titolo_pagina }}</h1>
    
    <form method="POST">
        {% csrf_token %}  {{ form.as_p }}  <button type="submit">Salva Libro</button>
    </form>
    
    <p><a href="{% url 'lista_libri' %}">Torna all'elenco</a></p>

    {% if form.errors %}
        <div style="color: red;">
            <h3>Ci sono errori nel Form:</h3>
            {{ form.errors }}
        </div>
    {% endif %}
</body>
</html>
