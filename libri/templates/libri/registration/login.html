<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Accedi al Catalogo</h1>

    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }} 

        <button type="submit">Login</button>
    </form>
    
    <p>Non hai un account? Registrati (tramite Admin per ora)</p>
    <p><a href="{% url 'password_reset' %}">Hai dimenticato la password?</a></p>

</body>
</html>
